<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">National Treasure shape language v0.1</title>
  <desc id="desc">Sixteen newly assigned eCODE-native geometric primitives arranged in a four by four catalogue. These are design conventions, not historical symbols.</desc>
  <rect width="800" height="800" fill="#fff"/>
  <style>
    .cell { fill: none; stroke: #d0d0d0; stroke-width: 1; }
    .g { fill: none; stroke: #111; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #111; }
    .id { font: 700 18px ui-monospace, monospace; fill: #111; }
    .name { font: 14px ui-sans-serif, sans-serif; fill: #555; }
  </style>

  <!-- grid -->
  <g>
    <path class="cell" d="M0 200H800M0 400H800M0 600H800M200 0V800M400 0V800M600 0V800"/>
  </g>

  <!-- P0 particularity -->
  <g transform="translate(0 0)">
    <circle class="dot" cx="100" cy="92" r="13"/>
    <text class="id" x="16" y="168">P0</text><text class="name" x="52" y="168">particularity</text>
  </g>

  <!-- P1 relation -->
  <g transform="translate(200 0)">
    <path class="g" d="M50 92H150"/>
    <text class="id" x="16" y="168">P1</text><text class="name" x="52" y="168">relation</text>
  </g>

  <!-- P2 environment -->
  <g transform="translate(400 0)">
    <circle class="g" cx="100" cy="92" r="48"/>
    <text class="id" x="16" y="168">P2</text><text class="name" x="52" y="168">environment</text>
  </g>

  <!-- P3 open context -->
  <g transform="translate(600 0)">
    <path class="g" d="M132 56A48 48 0 1 0 139 119"/>
    <text class="id" x="16" y="168">P3</text><text class="name" x="52" y="168">open context</text>
  </g>

  <!-- P4 attractor -->
  <g transform="translate(0 200)">
    <path class="g" d="M100 40L150 135H50Z"/>
    <text class="id" x="16" y="168">P4</text><text class="name" x="52" y="168">attractor</text>
  </g>

  <!-- P5 constituted body -->
  <g transform="translate(200 200)">
    <rect class="g" x="54" y="46" width="92" height="92"/>
    <text class="id" x="16" y="168">P5</text><text class="name" x="52" y="168">body</text>
  </g>

  <!-- P6 transformation -->
  <g transform="translate(400 200)">
    <path class="g" d="M55 48L145 136M145 48L55 136"/>
    <text class="id" x="16" y="168">P6</text><text class="name" x="52" y="168">transformation</text>
  </g>

  <!-- P7 invariant -->
  <g transform="translate(600 200)">
    <path class="g" d="M72 42V140M128 42V140"/>
    <text class="id" x="16" y="168">P7</text><text class="name" x="52" y="168">invariant</text>
  </g>

  <!-- P8 witnessed specimen -->
  <g transform="translate(0 400)">
    <circle class="g" cx="100" cy="92" r="48"/>
    <circle class="dot" cx="100" cy="92" r="11"/>
    <text class="id" x="16" y="168">P8</text><text class="name" x="52" y="168">witness</text>
  </g>

  <!-- P9 refusal -->
  <g transform="translate(200 400)">
    <path class="g" d="M45 92H82M118 92H155"/>
    <path class="g" d="M88 75L112 109"/>
    <text class="id" x="16" y="168">P9</text><text class="name" x="52" y="168">refusal</text>
  </g>

  <!-- PA iteration -->
  <g transform="translate(400 400)">
    <path class="g" d="M137 76C130 48 100 35 76 49C50 64 46 99 65 121C83 142 116 143 137 123C151 110 155 89 147 72"/>
    <path class="g" d="M128 58L151 72L138 96"/>
    <text class="id" x="16" y="168">PA</text><text class="name" x="52" y="168">iteration</text>
  </g>

  <!-- PB neighborhood -->
  <g transform="translate(600 400)">
    <circle class="g" cx="100" cy="92" r="14"/>
    <circle class="g" cx="100" cy="46" r="14"/>
    <circle class="g" cx="140" cy="69" r="14"/>
    <circle class="g" cx="140" cy="115" r="14"/>
    <circle class="g" cx="100" cy="138" r="14"/>
    <circle class="g" cx="60" cy="115" r="14"/>
    <circle class="g" cx="60" cy="69" r="14"/>
    <text class="id" x="16" y="168">PB</text><text class="name" x="52" y="168">neighborhood</text>
  </g>

  <!-- PC palimpsest -->
  <g transform="translate(0 600)">
    <circle class="g" cx="100" cy="92" r="52"/>
    <circle class="g" cx="100" cy="92" r="31"/>
    <circle class="g" cx="100" cy="92" r="10"/>
    <text class="id" x="16" y="168">PC</text><text class="name" x="52" y="168">palimpsest</text>
  </g>

  <!-- PD reflection -->
  <g transform="translate(200 600)">
    <path class="g" d="M100 38V142" stroke-dasharray="8 10"/>
    <path class="g" d="M48 120L78 62L91 120M152 120L122 62L109 120"/>
    <text class="id" x="16" y="168">PD</text><text class="name" x="52" y="168">reflection</text>
  </g>

  <!-- PE branch -->
  <g transform="translate(400 600)">
    <path class="g" d="M100 142V96M100 96L58 48M100 96L142 48"/>
    <text class="id" x="16" y="168">PE</text><text class="name" x="52" y="168">branch</text>
  </g>

  <!-- PF convergence -->
  <g transform="translate(600 600)">
    <path class="g" d="M58 48L100 96M142 48L100 96M100 96V142"/>
    <text class="id" x="16" y="168">PF</text><text class="name" x="52" y="168">convergence</text>
  </g>
</svg>
